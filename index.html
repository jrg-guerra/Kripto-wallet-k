<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kripto Wallet — acceso</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100dvh; display: grid; place-items: center;
    background: radial-gradient(900px 600px at 75% -10%, #1B2440 0%, #0F172A 60%) fixed, #0F172A;
    color: #F8FAFC; font: 15px/1.6 'Inter', system-ui, -apple-system, sans-serif; padding: 24px;
  }
  .card {
    max-width: 460px; width: 100%; text-align: center;
    background: rgba(255,255,255,.055); border: 1px solid rgba(255,255,255,.12);
    border-radius: 20px; padding: 40px 32px;
    backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
    box-shadow: 0 18px 50px rgba(2,6,23,.45);
  }
  .mark {
    width: 60px; height: 60px; border-radius: 18px; margin: 0 auto 16px;
    display: grid; place-items: center; color: #0F172A;
    background: linear-gradient(135deg, #FBBF24, #F59E0B 55%, #D97706);
    box-shadow: 0 10px 30px rgba(245,158,11,.4);
  }
  h1 { font-size: 21px; font-weight: 650; margin-bottom: 6px; }
  p { color: #B6C0D4; font-size: 13.5px; }
  .estado { margin: 18px 0; font-size: 13px; color: #7C8AA5; }
  .estado.ok { color: #34D399; }
  .estado.off { color: #F87171; }
  a.btn {
    display: inline-block; margin-top: 4px; padding: 13px 26px; border-radius: 14px;
    background: linear-gradient(135deg, #FBBF24, #F59E0B 55%, #D97706); color: #0F172A;
    font-weight: 600; font-size: 14.5px; text-decoration: none; cursor: pointer;
    box-shadow: 0 10px 28px rgba(245,158,11,.35);
  }
  code {
    display: block; margin-top: 16px; padding: 12px; border-radius: 10px; text-align: left;
    background: rgba(0,0,0,.35); border: 1px solid rgba(255,255,255,.1);
    color: #B6C0D4; font: 12px/1.5 ui-monospace, Menlo, monospace; word-break: break-all;
  }
  .tip { margin-top: 10px; font-size: 12px; color: #7C8AA5; }
</style>
</head>
<body>
  <div class="card">
    <div class="mark">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg>
    </div>
    <h1>Kripto Wallet</h1>
    <p>Simulador de paper trading — billetera real vs billetera ficticia.</p>
    <div class="estado" id="estado">Comprobando servidor…</div>
    <a class="btn" href="http://localhost:8517" id="ir">Abrir dashboard</a>
    <code>node /Users/kash/Documentos/htdocs/kripto-Wallet/src/server.mjs</code>
    <p class="tip">Si el dashboard no abre, ejecuta ese comando en Terminal (o doble clic en <b>start.command</b>) y vuelve a intentar.</p>
  </div>
<script>
  const estado = document.getElementById('estado');
  fetch('http://localhost:8517/api/state', { mode: 'no-cors' })
    .then(() => {
      estado.textContent = '● Servidor activo — redirigiendo…';
      estado.className = 'estado ok';
      setTimeout(() => location.href = 'http://localhost:8517', 700);
    })
    .catch(() => {
      estado.textContent = '● Servidor apagado — arráncalo con el comando de abajo';
      estado.className = 'estado off';
    });
</script>
</body>
</html>
